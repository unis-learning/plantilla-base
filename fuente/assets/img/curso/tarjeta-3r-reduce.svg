<!-- UNIS-001 T5: figura de ejemplo del catálogo en la familia de UNIS. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Bolsa de tela con alimentos.">
  <defs><clipPath id="tarjeta-3r-reduce-recorte"><circle cx="80" cy="80" r="80"/></clipPath></defs>
  <g clip-path="url(#tarjeta-3r-reduce-recorte)">
    <!-- fondo y key visual de la serie: disco guinda y base roja, iguales en las tres -->
    <rect width="160" height="160" fill="#F3EEEC"/>
    <circle cx="80" cy="80" r="64" fill="#840029"/>
    <path d="M31.7 122H128.3A64 64 0 0 1 31.7 122Z" fill="#D32E3F"/>
    <!-- un asa de la bolsa, detrás de los alimentos -->
    <path d="M60 80V62A20 20 0 0 1 100 62V80H95V62A15 15 0 0 0 65 62V80Z" fill="#E8E1DE"/>
    <!-- los alimentos que asoman: hojas, un fruto y el pan (el único amarillo) -->
    <path d="M46 82V58A24 24 0 0 1 70 34V58A24 24 0 0 1 46 82Z" fill="#9F9D98"/>
    <path d="M66 80V62A20 20 0 0 0 46 42V60A20 20 0 0 0 66 80Z" fill="#E8E1DE"/>
    <rect x="92" y="26" width="15" height="62" rx="7.5" fill="#FCC146" transform="rotate(18 99 60)"/>
    <circle cx="74" cy="68" r="12" fill="#D32E3F"/>
    <!-- la bolsa de tela y la otra asa, caída sobre el frente -->
    <path d="M48 76H112L108 120Q107.5 126 102 126H58Q52.5 126 52 120Z" fill="#FFFFFF"/>
    <path d="M62 76V90A18 18 0 0 0 98 90V76H92.5V90A12.5 12.5 0 0 1 67.5 90V76Z" fill="#E8E1DE"/>
  </g>
</svg>
