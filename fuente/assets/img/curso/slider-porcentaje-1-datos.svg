<!-- UNIS-001 T4: figura de ejemplo del catálogo («Slider de pasos», paso 1 de 4: cómo calcular el 25 % de
     40 estudiantes), dibujada en la familia gráfica de UNIS (INSTITUCION §1.4), de la misma mano que
     ilustracion-descarga.svg: formas planas sin trazo de contorno ni sombra, el disco amarillo recortado por
     el borde, el semicírculo rojo en la base y el anillo guinda en la esquina, iguales en las cuatro figuras
     de la serie. Paleta de skin/paleta.css; fondo #F3EEEC (superficie apagada), porque va en un panel blanco.
     Qué se ve: un grupo de diez estudiantes en una tarjeta blanca y, debajo, los dos datos del ejemplo en dos bloques
     de extremo redondeado: «Total: 40» y «Porcentaje: 25 %».
     Lo destacado va en guinda (el porcentaje, el dato que se va a aplicar); el amarillo es solo el disco de fondo.
     Texto: solo los rótulos del ejemplo, en Gotham (con la fuente del sistema si no está instalada). -->
