<!-- Ilustración de marca · UNIS Virtual · presentación de la evaluación (.ova-eval-intro, primera
     diapositiva de evaluacion.html): la ilustración por defecto cuando el banco no trae «Vincular Imagen-N».
     Familia gráfica de UNIS (INSTITUCION §1.4), de la misma mano que ilustracion-descarga.svg: formas
     planas sin trazo de contorno ni sombra, el disco amarillo, el semicírculo rojo en la base y el anillo
     guinda en la esquina. Paleta de skin/paleta.css. Fondo transparente sobre el crema de la tarjeta.
     Qué se ve: las preguntas de selección (una pila de tarjetas, una por pregunta; la de adelante con su
     enunciado y sus opciones) y el apareamiento (dos columnas de bloques unidos por líneas).
     Acento: la opción elegida, lo que la evaluación pide hacer. Sin texto ni fuentes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" role="img" aria-labelledby="ilu-evaluacion-titulo">
  <title id="ilu-evaluacion-titulo">Una pila de tarjetas de pregunta; la de adelante muestra un enunciado y cuatro opciones, una de ellas elegida. Al lado, dos columnas de bloques unidos por líneas.</title>

  <!-- key visual detrás -->
  <circle cx="226" cy="168" r="138" fill="#FCC146"/>
  <path d="M40 316 a86 86 0 0 1 172 0 z" fill="#D32E3F"/>
  <circle cx="356" cy="268" r="30" fill="none" stroke="#840029" stroke-width="10"/>

  <!-- las preguntas que siguen: dos tarjetas detrás, escalonadas -->
  <rect x="120" y="56" width="176" height="224" rx="8" fill="#E8E1DE"/>
  <rect x="120" y="56" width="176" height="44" rx="8" fill="#9F9D98"/>
  <rect x="120" y="86" width="176" height="14" fill="#9F9D98"/>
  <rect x="102" y="74" width="176" height="224" rx="8" fill="#F3EEEC"/>
  <rect x="102" y="74" width="176" height="44" rx="8" fill="#D32E3F"/>
  <rect x="102" y="104" width="176" height="14" fill="#D32E3F"/>

  <!-- la primera pregunta -->
  <rect x="84" y="92" width="176" height="224" rx="8" fill="#FFFFFF"/>
  <rect x="84" y="92" width="176" height="44" rx="8" fill="#840029"/>
  <rect x="84" y="122" width="176" height="14" fill="#840029"/>
  <rect x="104" y="109" width="88" height="10" rx="5" fill="#FFFFFF" opacity=".9"/>
  <!-- enunciado -->
  <rect x="104" y="154" width="136" height="9" rx="4.5" fill="#E8E1DE"/>
  <rect x="104" y="172" width="100" height="9" rx="4.5" fill="#E8E1DE"/>
  <!-- opciones -->
  <g fill="none" stroke="#9F9D98" stroke-width="3">
    <circle cx="112" cy="208" r="6"/>
    <circle cx="112" cy="264" r="6"/>
    <circle cx="112" cy="292" r="6"/>
  </g>
  <g fill="#E8E1DE">
    <rect x="128" y="204" width="96" height="8" rx="4"/>
    <rect x="128" y="260" width="104" height="8" rx="4"/>
    <rect x="128" y="288" width="72" height="8" rx="4"/>
  </g>
  <!-- acento: la opción elegida -->
  <rect x="98" y="224" width="148" height="24" rx="12" fill="#FCC146"/>
  <circle cx="112" cy="236" r="7" fill="#840029"/>
  <rect x="128" y="232" width="84" height="8" rx="4" fill="#840029"/>

  <!-- el apareamiento: dos columnas de bloques y las líneas que los unen -->
  <rect x="270" y="28" width="140" height="120" rx="8" fill="#5C001D"/>
  <path d="M316 56 L364 88 M316 88 L364 120 M316 120 L364 56" fill="none" stroke="#9F9D98" stroke-width="4" stroke-linecap="round"/>
  <g fill="#FFFFFF">
    <path d="M294 46 h22 v20 h-22 a10 10 0 0 1 0 -20 z"/>
    <path d="M294 78 h22 v20 h-22 a10 10 0 0 1 0 -20 z"/>
    <path d="M294 110 h22 v20 h-22 a10 10 0 0 1 0 -20 z"/>
  </g>
  <g fill="#D32E3F">
    <path d="M364 46 h22 a10 10 0 0 1 0 20 h-22 z"/>
    <path d="M364 78 h22 a10 10 0 0 1 0 20 h-22 z"/>
    <path d="M364 110 h22 a10 10 0 0 1 0 20 h-22 z"/>
  </g>
</svg>
